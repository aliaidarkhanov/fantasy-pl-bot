# Локальный Postgres для разработки. Учётные данные — только для локальной машины,
# порт открыт лишь на 127.0.0.1.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
      POSTGRES_DB: fpl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
